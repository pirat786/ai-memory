[package]
name = "ai-memory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Unified cross-agent AI memory (CLI + Web UI + Google Drive sync) without MCP"

[[bin]]
name = "aimem"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
