[workspace]
resolver = "2"
members = ["crates/aimem-core", "crates/aimem-cli", "app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }

aimem-core = { path = "crates/aimem-core" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
