<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ai-memory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <div style="display:flex;align-items:baseline;gap:6px;">
        <h1>ai-memory</h1>
        <span id="appVersion" style="font-size:11px;color:var(--muted);"></span>
      </div>
      <button id="langBtn" style="padding:2px 8px;font-size:11px;" onclick="toggleLang()">EN</button>
    </div>
    <div class="project-list" id="projectList"></div>
    <div class="sidebar-footer">
      <div class="status-line">
        <span class="dot ok"></span>
        <span id="agentsReadyText">Агенты и PATH настроены</span>
      </div>
      <div class="status-line">
        <span class="dot" id="syncDot"></span>
        <span id="syncStatusText">Google Drive: не подключён</span>
      </div>
      <button id="googleActionBtn" class="primary" onclick="handleGoogleAction()">Подключить Google</button>
      <div style="display:flex;gap:6px;">
        <button id="settingsBtn" style="flex:1;" onclick="openSettings()">Настройки</button>
        <button id="googleLogoutBtn" class="danger" style="display:none;" onclick="disconnectGoogle()">Выйти из Google</button>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Поиск по памяти (FTS5)..." oninput="debouncedLoadMemories()" />
      </div>
      <select id="filterKind" onchange="resetAndLoadMemories()" style="max-width:130px;"></select>
      <select id="filterAgent" onchange="resetAndLoadMemories()" style="max-width:120px;">
        <option value="all">Все агенты</option>
        <option value="user">user</option>
        <option value="antigravity">antigravity</option>
        <option value="claude">claude</option>
        <option value="codex">codex</option>
        <option value="cursor">cursor</option>
        <option value="project">project</option>
      </select>
      <button id="importBtn" onclick="importMemories()">Импорт памяти</button>
      <button id="updateBtn" class="primary" style="display:none;" onclick="installUpdate()">Обновить</button>
      <button id="newBtn" class="primary" onclick="document.getElementById('newContent').focus()">+ Новая запись</button>
    </header>

    <div class="content">
      <div class="composer">
        <textarea id="newContent" placeholder="Записать решение, архитектуру, баг или правило..."></textarea>
        <div class="composer-row">
          <select id="newKind"></select>
          <input id="newTags" placeholder="теги через запятую (rust, auth)" style="flex:1;min-width:140px" />
          <select id="newAgent">
            <option value="user">user</option>
            <option value="antigravity">antigravity</option>
            <option value="claude">claude</option>
            <option value="codex">codex</option>
            <option value="cursor">cursor</option>
          </select>
          <button id="saveMemBtn" class="primary" onclick="addMemory()">Сохранить</button>
        </div>
      </div>

      <div id="memoriesList" style="display:flex;flex-direction:column;gap:10px;"></div>
      <button id="loadMoreBtn" style="display:none;align-self:center;margin-top:10px;" onclick="loadMoreMemories()">Загрузить ещё</button>
    </div>
  </main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2 id="settingsTitle">Настройки устройства</h2>
      <div class="field">
        <label id="cfgDeviceLabel">Имя этого ПК</label>
        <input id="cfgDevice" placeholder="DESKTOP-WORK" />
      </div>
      <div class="field">
        <label id="cfgScanDirsLabel">Папки проектов для импорта (по одной на строке)</label>
        <textarea id="cfgScanDirs" rows="2" placeholder="C:\Projects" style="min-height:52px;"></textarea>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-top:4px;">
        <input id="cfgAutoSync" type="checkbox" style="width:auto;" />
        <span id="cfgAutoSyncLabel">Автосинхронизация каждые 5 мин</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-top:4px;">
        <input id="cfgAutostart" type="checkbox" style="width:auto;" />
        <span id="cfgAutostartLabel">Запускать вместе с Windows</span>
      </label>
      <details class="inbox-settings">
        <summary id="inboxTitle">Очередь записей агентов</summary>
        <p id="inboxHelp">Приложение импортирует записи из выбранной папки, пока работает.</p>
        <div class="field">
          <label id="inboxDirectoryLabel" for="inboxDirectory">Папка очереди</label>
          <input id="inboxDirectory" autocomplete="off" placeholder="C:\Projects\aimem-inbox" />
        </div>
        <div class="field">
          <label id="inboxProjectsLabel" for="inboxProjects">Разрешённые ID проектов</label>
          <textarea id="inboxProjects" rows="2" placeholder="local/my-project"></textarea>
        </div>
        <button id="importInboxBtn" type="button" onclick="importInbox()">Импортировать сохранённую очередь</button>
      </details>
      <div class="composer-row" style="justify-content:space-between;margin-top:6px;">
        <button id="reauthBtn" onclick="authGoogle()">Переподключить Google</button>
        <div style="display:flex;gap:8px;">
          <button id="closeModalBtn" onclick="closeSettings()">Закрыть</button>
          <button id="saveCfgBtn" class="primary" onclick="saveSettings()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="i18n/ru.js"></script>
  <script src="i18n/en.js"></script>
  <script src="app.js"></script>
</body>
</html>
