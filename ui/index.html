<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ai-memory — Единая память агентов</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c222b;
      --border: #2b323c;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.14);
      --green: #3fb950;
      --amber: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .brand {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand span {
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .project-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .project-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .project-item:hover { background: var(--panel-2); }
    .project-item.active {
      background: var(--accent-soft);
      border-color: rgba(88, 166, 255, 0.35);
    }
    .project-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .project-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    input, textarea, select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    .search-box input { width: 100%; }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { border-color: #485363; background: #232a35; }
    button.primary {
      background: var(--accent);
      color: #0b1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.danger { color: var(--red); }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .composer textarea {
      width: 100%;
      min-height: 68px;
      resize: vertical;
    }
    .composer-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .memory-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .memory-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pills { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .kind-decision { background: rgba(88,166,255,0.16); color: var(--accent); }
    .kind-arch { background: rgba(188,140,255,0.16); color: var(--purple); }
    .kind-bug { background: rgba(248,81,73,0.16); color: var(--red); }
    .kind-pref { background: rgba(63,185,80,0.16); color: var(--green); }
    .kind-note { background: rgba(210,153,34,0.16); color: var(--amber); }
    .memory-body {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .memory-time { font-size: 11px; color: var(--muted); }
    .status-line {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--green); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: min(520px, 92vw);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal h2 { margin: 0; font-size: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      z-index: 60;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>ai-memory</h1>
      <span>No MCP</span>
    </div>
    <div class="project-list" id="projectList"></div>
    <div class="sidebar-footer">
      <div class="status-line">
        <span class="dot" id="syncDot"></span>
        <span id="syncStatusText">Google Drive: не подключён</span>
      </div>
      <button onclick="syncNow()">Синхронизировать</button>
      <button onclick="openSettings()">Настройки Google и агентов</button>
    </div>
  </aside>

  <main>
    <header>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Поиск по памяти (FTS5)..." oninput="debouncedLoadMemories()" />
      </div>
      <button onclick="installRules()">Подключить агентов</button>
      <button class="primary" onclick="document.getElementById('newContent').focus()">+ Новая запись</button>
    </header>

    <div class="content">
      <div class="composer">
        <textarea id="newContent" placeholder="Записать решение, архитектуру, баг или правило..."></textarea>
        <div class="composer-row">
          <select id="newKind">
            <option value="decision">decision — решение</option>
            <option value="arch">arch — архитектура</option>
            <option value="bug">bug — грабли / фикс</option>
            <option value="pref">pref — предпочтение</option>
            <option value="note">note — заметка</option>
          </select>
          <input id="newTags" placeholder="теги через запятую (rust, auth)" style="flex:1;min-width:140px" />
          <select id="newAgent">
            <option value="user">user</option>
            <option value="antigravity">antigravity</option>
            <option value="claude">claude</option>
            <option value="cursor">cursor</option>
          </select>
          <button class="primary" onclick="addMemory()">Сохранить</button>
        </div>
      </div>

      <div id="memoriesList" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2>Настройки Google Drive Sync</h2>
      <div class="field">
        <label>Имя этого ПК</label>
        <input id="cfgDevice" placeholder="DESKTOP-WORK" />
      </div>
      <div class="field">
        <label>Google OAuth Client ID (Desktop app)</label>
        <input id="cfgClientId" placeholder="123456-xxx.apps.googleusercontent.com" />
      </div>
      <div class="field">
        <label>Google OAuth Client Secret (если требуется)</label>
        <input id="cfgClientSecret" type="password" placeholder="GOCSPX-..." />
      </div>
      <div class="composer-row" style="justify-content:space-between;margin-top:6px;">
        <button onclick="authGoogle()">Подключить Google</button>
        <div style="display:flex;gap:8px;">
          <button onclick="closeSettings()">Закрыть</button>
          <button class="primary" onclick="saveSettings()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentProjectId = 'all';
    let searchTimer = null;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3200);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadStatus() {
      const st = await api('/api/status');
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncStatusText');
      if (st.google_connected) {
        dot.classList.add('ok');
        txt.textContent = st.last_sync_at
          ? `Синк: ${new Date(st.last_sync_at).toLocaleString()}`
          : 'Google Drive подключён';
      } else {
        dot.classList.remove('ok');
        txt.textContent = 'Google Drive: не подключён';
      }
      document.getElementById('cfgDevice').value = st.device_name || '';
      document.getElementById('cfgClientId').value = st.google_client_id || '';
    }

    async function loadProjects() {
      const projects = await api('/api/projects');
      const list = document.getElementById('projectList');
      list.innerHTML = '';

      const allEl = document.createElement('div');
      allEl.className = 'project-item' + (currentProjectId === 'all' ? ' active' : '');
      allEl.innerHTML = `<div><div class="project-name">Все проекты</div><div class="project-sub">общий поток памяти</div></div>`;
      allEl.onclick = () => { currentProjectId = 'all'; loadProjects(); loadMemories(); };
      list.appendChild(allEl);

      for (const p of projects) {
        const el = document.createElement('div');
        el.className = 'project-item' + (currentProjectId === p.id ? ' active' : '');
        el.innerHTML = `
          <div style="min-width:0">
            <div class="project-name">${escapeHtml(p.name)}</div>
            <div class="project-sub">${escapeHtml(p.id)}</div>
          </div>
          <span class="badge">${p.count}</span>
        `;
        el.onclick = () => { currentProjectId = p.id; loadProjects(); loadMemories(); };
        list.appendChild(el);
      }
    }

    function debouncedLoadMemories() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadMemories, 180);
    }

    async function loadMemories() {
      const q = document.getElementById('searchInput').value.trim();
      const params = new URLSearchParams();
      if (currentProjectId !== 'all') params.set('project_id', currentProjectId);
      if (q) params.set('q', q);
      const items = await api('/api/memories?' + params.toString());
      const box = document.getElementById('memoriesList');
      box.innerHTML = '';

      if (!items.length) {
        box.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:16px;">Записей пока нет.</div>`;
        return;
      }

      for (const m of items) {
        const card = document.createElement('div');
        card.className = 'memory-card';
        const tagsHtml = m.tags
          ? m.tags.split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="badge">#${escapeHtml(t)}</span>`).join('')
          : '';
        card.innerHTML = `
          <div class="memory-meta">
            <div class="pills">
              <span class="pill kind-${escapeHtml(m.kind)}">${escapeHtml(m.kind)}</span>
              <span class="badge">${escapeHtml(m.project_id)}</span>
              <span class="badge">@${escapeHtml(m.source_agent)}</span>
              ${tagsHtml}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="memory-time">${new Date(m.updated_at).toLocaleString()}</span>
              <button class="danger" style="padding:3px 8px;font-size:11px;" onclick="deleteMemory('${m.id}')">Удалить</button>
            </div>
          </div>
          <div class="memory-body">${escapeHtml(m.content)}</div>
        `;
        box.appendChild(card);
      }
    }

    async function addMemory() {
      const content = document.getElementById('newContent').value.trim();
      if (!content) return toast('Введите текст записи');
      const project_id = currentProjectId === 'all' ? 'global' : currentProjectId;
      await api('/api/memories', {
        method: 'POST',
        body: JSON.stringify({
          project_id,
          kind: document.getElementById('newKind').value,
          content,
          tags: document.getElementById('newTags').value,
          source_agent: document.getElementById('newAgent').value,
        }),
      });
      document.getElementById('newContent').value = '';
      document.getElementById('newTags').value = '';
      toast('Сохранено');
      await loadProjects();
      await loadMemories();
    }

    async function deleteMemory(id) {
      await api('/api/memories/' + id, { method: 'DELETE' });
      toast('Удалено');
      await loadProjects();
      await loadMemories();
    }

    async function installRules() {
      const res = await api('/api/rules/install', { method: 'POST' });
      toast('Правила обновлены: ' + res.files.length + ' файл(а)');
    }

    async function syncNow() {
      try {
        const res = await api('/api/sync', { method: 'POST' });
        toast(`Синхронизировано (+${res.merged.memories_added} / ~${res.merged.memories_updated})`);
        await loadStatus();
        await loadProjects();
        await loadMemories();
      } catch (e) {
        toast(e.message);
      }
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

    async function saveSettings() {
      await api('/api/config', {
        method: 'POST',
        body: JSON.stringify({
          device_name: document.getElementById('cfgDevice').value,
          google_client_id: document.getElementById('cfgClientId').value,
          google_client_secret: document.getElementById('cfgClientSecret').value || null,
        }),
      });
      toast('Настройки сохранены');
      closeSettings();
      await loadStatus();
    }

    async function authGoogle() {
      await saveSettings();
      try {
        await api('/api/auth/google', { method: 'POST' });
        toast('Google Drive подключён!');
        await loadStatus();
      } catch (e) {
        toast(e.message);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    (async () => {
      await loadStatus();
      await loadProjects();
      await loadMemories();
    })();
  </script>
</body>
</html>
